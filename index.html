<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0e0f13">
  <meta name="description" content="Personal gym tracker: 6-week PPL ×2 block, double progression, body weight, steps and cardio. Works offline.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout Log">
  <meta name="color-scheme" content="dark light">

  <title>Workout Log</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">
      <span class="dot" aria-hidden="true"></span>
      Workout Log
      <small id="header-sub"></small>
    </h1>
  </header>

  <main id="app" aria-live="polite"></main>

  <div class="rest-bar" id="rest-bar" aria-live="polite"></div>

  <nav class="bottom-nav" aria-label="Primary">
    <div class="nav-items" id="nav-items"></div>
  </nav>

  <noscript>
    <p style="padding:24px;text-align:center">Workout Log needs JavaScript enabled.</p>
  </noscript>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
